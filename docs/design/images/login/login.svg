<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">登录卡片与等待授权的界面布局</title>
<desc id="desc">左侧是未登录界面，仅有 ChatGPT 浏览器登录入口。右侧是同一次登录的等待界面，提供重新打开浏览器、复制链接和取消登录。两种状态都保留设置入口。</desc>
<defs>
  <style>
    text { font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: #192b3d; }
    .heading { font-size: 25px; font-weight: 600; fill: #192b3d; }
    .body { font-size: 20px; fill: #526477; }
    .small { font-size: 17px; fill: #687b8d; }
    .button { font-size: 20px; font-weight: 600; }
    .path { font-family: 'Consolas', 'Noto Sans Mono CJK SC', monospace; font-size: 19px; fill: #30475b; }
  </style>
</defs>
<rect width="1440" height="900" rx="24" fill="#f3f6f9"/>
<text x="58" y="68" class="title">浏览器登录</text>
<text x="58" y="106" class="body">数据目录就绪后，账号状态决定主窗口显示的内容。</text>
<text x="58" y="166" class="heading">未登录</text>
<text x="756" y="166" class="heading">等待浏览器授权</text>

<rect x="58" y="192" width="626" height="566" rx="16" fill="#ffffff" stroke="#d9e2ea" stroke-width="2"/>
<path d="M74 192 H668 Q684 192 684 208 V262 H58 V208 Q58 192 74 192" fill="#eaf0f5"/>
<text x="84" y="236" font-size="22" font-weight="700" fill="#253c50">Agentelier</text>
<text x="442" y="234" class="small">未登录</text>
<rect x="552" y="211" width="102" height="34" rx="7" fill="#ffffff" stroke="#d1dce5"/>
<text x="603" y="234" text-anchor="middle" font-size="18" fill="#30475b">设置</text>
<circle cx="371" cy="326" r="27" fill="#e8f2f1"/>
<path d="M360 326 H382 M373 317 L382 326 L373 335" stroke="#247568" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="371" y="394" text-anchor="middle" class="heading">连接你的 ChatGPT 账号</text>
<text x="371" y="438" text-anchor="middle" class="body">通过系统浏览器完成账号认证</text>
<text x="371" y="471" text-anchor="middle" class="body">并授权使用 ChatGPT 订阅</text>
<rect x="171" y="515" width="400" height="58" rx="10" fill="#246f65"/>
<text x="371" y="552" text-anchor="middle" class="button" fill="#ffffff">使用 ChatGPT 登录</text>
<text x="371" y="612" text-anchor="middle" class="small">登录凭据保存在你指定的数据目录中</text>
<path d="M84 654 H658" stroke="#e3e9ef"/>
<text x="86" y="690" class="small">数据目录已就绪</text>
<text x="86" y="724" class="path">D:\AgentelierData</text>

<rect x="756" y="192" width="626" height="566" rx="16" fill="#ffffff" stroke="#d9e2ea" stroke-width="2"/>
<path d="M772 192 H1366 Q1382 192 1382 208 V262 H756 V208 Q756 192 772 192" fill="#eaf0f5"/>
<text x="782" y="236" font-size="22" font-weight="700" fill="#253c50">Agentelier</text>
<text x="1140" y="234" class="small">授权中</text>
<rect x="1250" y="211" width="102" height="34" rx="7" fill="#ffffff" stroke="#d1dce5"/>
<text x="1301" y="234" text-anchor="middle" font-size="18" fill="#30475b">设置</text>
<circle cx="1069" cy="326" r="25" fill="#eef4f8" stroke="#bfd3df" stroke-width="3"/>
<path d="M1069 310 V326 L1080 333" stroke="#50768d" fill="none" stroke-width="3" stroke-linecap="round"/>
<text x="1069" y="394" text-anchor="middle" class="heading">请在浏览器中完成登录</text>
<text x="1069" y="438" text-anchor="middle" class="body">完成后，应用会自动接收结果</text>
<text x="1069" y="471" text-anchor="middle" class="body">无需把密码或验证码输入应用</text>
<rect x="808" y="515" width="252" height="56" rx="9" fill="#e8f2f1" stroke="#b7d5cf"/>
<text x="934" y="550" text-anchor="middle" class="button" fill="#246f65">重新打开浏览器</text>
<rect x="1078" y="515" width="252" height="56" rx="9" fill="#ffffff" stroke="#c9d6e0"/>
<text x="1204" y="550" text-anchor="middle" class="button" fill="#30475b">复制登录链接</text>
<text x="1069" y="614" text-anchor="middle" font-size="20" fill="#526477">取消登录</text>
<path d="M782 654 H1356" stroke="#e3e9ef"/>
<text x="784" y="690" class="small">等待同一次授权结果</text>
<text x="784" y="724" font-size="18" fill="#526477">重新打开或复制链接不会发起新的登录</text>

<path d="M700 461 H740 M731 452 L740 461 L731 470" fill="none" stroke="#7c95a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="58" y="797" width="1324" height="62" rx="12" fill="#e8eef4"/>
<text x="85" y="835" font-size="19" fill="#385066">授权完成并保存凭据后，主内容区切换为模型连接验证；账号摘要留在账号入口与设置中。</text>
</svg>