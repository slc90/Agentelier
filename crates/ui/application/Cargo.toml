[package]
name = "agentelier_application"
publish = false
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { workspace = true, features = ["bevy_sprite_render"] }
ab_glyph.workspace = true
bevy_app_assets = { path = "../assets" }
bevy_widgetry_asset.workspace = true
agentelier_login = { path = "../../agent/login" }
agentelier_login_ui = { path = "../login_ui" }
agentelier_agent_host = { path = "../agent_host" }
agentelier_chat_ui = { path = "../chat_ui" }
agentelier_controls = { path = "../controls" }
bevy_widgetry = { workspace = true, features = [
  "canvas",
  "check_box",
  "combo_box",
  "file_dialog",
  "job",
  "number_input",
  "radio_group",
  "scroll_area",
  "segmented",
  "slider",
  "splash",
  "table",
  "text_field",
  "toggle_button",
  "tray",
] }
bevy_widgetry_path_display.workspace = true
bevy_brp_runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
ron.workspace = true
tracing.workspace = true
winsafe = { workspace = true, features = ["user"] }
tempfile.workspace = true
time.workspace = true

[lints]
workspace = true
