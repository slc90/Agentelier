[workspace]
resolver = "3"
members = [
  "app",
  "crates/ui/application",
  "crates/ui/assets",
  "crates/ui/login_ui",
  "crates/ui/agent_host",
  "crates/ui/chat_ui",
  "crates/ui/markdown",
  "crates/agent/login",
  "crates/agent/account",
  "crates/agent/llm_model",
  "crates/agent/runtime",
  "crates/agent/conversation",
  "crates/agent/session_store",
  "crates/agent/memory",
  "crates/agent/turn_runner",
  "crates/agent/tools",
  "crates/agent/mcp",
  "crates/agent/prompts",
  "crates/agent/project_context",
  "crates/agent/skills",
  "crates/bridge/conversation",
  "crates/bridge/account",
  "crates/bridge/llm_model",
  "crates/bridge/connection",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false }
bevy_widgetry_path_display = { git = "https://github.com/slc90/bevy_widgetry" }
bevy_widgetry = { git = "https://github.com/slc90/bevy_widgetry", default-features = false, features = [
  "window",
  "app_logging",
  "ui_scale",
] }
bevy_brp_runtime = { git = "https://github.com/slc90/bevy_brp" }
serde = { version = "1.0", features = ["derive"] }
ron = "0.12.2"
rhai = { version = "1.27.0", features = ["sync", "no_module"] }
rmcp = { version = "=3.9.0", default-features = false, features = [
  "client",
  "transport-async-rw",
  "transport-streamable-http-client-reqwest",
] }
tracing = "0.1.44"
winsafe = { version = "0.0.29", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
serde_json = "1.0"
rusqlite = { version = "0.43.0", default-features = false, features = [
  "bundled",
] }
regex = "1.13"
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", default-features = false, features = [
  "rt",
  "sync",
  "net",
  "io-util",
  "process",
  "time",
  "macros",
] }
win32job = "2.1.0"
windows = { version = "0.62", features = ["Win32_System_Threading"] }
process-wrap = { version = "10.0.1", default-features = false, features = [
  "tokio1",
  "job-object",
  "kill-on-drop",
  "creation-flags",
] }
uuid = { version = "1", default-features = false, features = [
  "std",
  "v4",
  "serde",
] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
bytes = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "handshake",
] }
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "native-tls",
  "system-proxy",
  "json",
] }
base64 = "0.23"
sha2 = "0.10"
getrandom = "0.4"
httparse = "1.10"
image = { version = "0.25.9", default-features = false, features = [
  "png",
  "jpeg",
] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "wav", "pcm", "id3v2"] }
url = "2.5"
uritemplate = { package = "uritemplate-next", version = "0.2.0" }
time = { version = "0.3", default-features = false, features = ["parsing"] }

[workspace.dependencies.bevy]
version = "*"
default-features = false
features = [
  "std",
  "async_executor",
  "multi_threaded",
  "bevy_asset",
  "bevy_log",
  "reflect_auto_register",
  "bevy_scene",
  "bevy_window",
  "bevy_winit",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_ui_widgets",
  "bevy_input_focus",
  "ui_picking",
  "png",
  "complex_script_segmentation",
  "system_clipboard",
  "system_font_discovery",
]

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
let_underscore_must_use = "deny"
disallowed_macros = "deny"
type_complexity = "allow"
too_many_arguments = "allow"

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
debug = 0
opt-level = 3

[profile.release]
debug = "line-tables-only"
